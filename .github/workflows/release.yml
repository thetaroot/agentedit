name: Release

# On a version tag: build sdist + wheel, attach them to the GitHub Release for
# that tag, and publish the same artifacts to PyPI under the distribution name
# `agentedit`. PyPI is authenticated with the repository secret
# PYPI_API_TOKEN (a project-scoped API token for agentedit); it never appears
# in files or logs.
#
# `skip-existing: true` keeps the pipeline green when a tag is re-pushed for an
# already-published version (PyPI files are immutable).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build --outdir dist
      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/agentedit --version
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
